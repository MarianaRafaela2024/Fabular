<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <style>
    html.alto-contraste,
    html.alto-contraste body,
    html.alto-contraste .login-bg,
    html.alto-contraste body.login-body,
    html.alto-contraste .app-header,
    html.alto-contraste .sidebar,
    html.alto-contraste .app-main,
    html.alto-contraste .app-layout {
      background-color: #0D1117 !important;
      background: #0D1117 !important;
      color: #E6EDF3 !important;
    }
  </style>
  <script>
    (function() {
      try {
        if (localStorage.getItem('mundoHistorias_modoNoturno') === '1') {
          document.documentElement.classList.add('alto-contraste');
          document.documentElement.style.backgroundColor = '#0D1117';
        }
        var f = localStorage.getItem('mundoHistorias_tamanhoFonte');
        if (f) {
          document.documentElement.style.fontSize = f + 'px';
          document.documentElement.style.setProperty('--fonte-base', f + 'px');
        }
      } catch(e) {}
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Fabular</title>
  <link rel="icon" type="image/png" href="midia/iconeRaposa.png">
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"></head>
<body class="login-body">

  <!-- ═══════════ LOGIN ═══════════ -->
  <div class="login-bg">

    <div class="estrelas-bg" aria-hidden="true">
      <span class="estrela-flutuante" style="--d:0s;  --x:8%;  --y:12%">⭐</span>
      <span class="estrela-flutuante" style="--d:1.2s;--x:82%; --y:10%">✨</span>
      <span class="estrela-flutuante" style="--d:2s;  --x:55%; --y:75%">⭐</span>
      <span class="estrela-flutuante" style="--d:.6s; --x:22%; --y:82%">✨</span>
      <span class="estrela-flutuante" style="--d:1.7s;--x:72%; --y:58%">⭐</span>
      <span class="estrela-flutuante" style="--d:3s;  --x:92%; --y:45%">✨</span>
      <span class="estrela-flutuante" style="--d:.3s; --x:38%; --y:20%">🌟</span>
      <span class="estrela-flutuante" style="--d:2.4s;--x:15%; --y:50%">✨</span>
    </div>

    <div class="login-wrapper">

      <div class="login-logo" aria-label="Mundo das Histórias">
        <img class="login-logo-icon" src="midia/iconeRaposa.png" alt="Logo Raposa">
        <h1 class="login-titulo">Fabular - Leitura Gamificada</h1>
        <p class="login-subtitulo">Aventuras de leitura feitas pra você!</p>
      </div>

      <div class="login-card oculto" id="crianca-card" role="main">
        <h2 class="login-card-titulo">👋 Quem é você?</h2>

        <!-- Nome -->
        <div class="campo-grupo">
          <label class="campo-label" for="input-nome">Seu nome ou apelido</label>
          <input
            type="text"
            id="input-nome"
            class="campo-input"
            placeholder="Ex: Lulú, Bento, Ana..."
            maxlength="20"
            autocomplete="given-name"
            aria-required="true"
          />
          <span class="campo-erro oculto" id="erro-nome" role="alert">Por favor, escreva seu nome! 😊</span>
        </div>

        <!-- Avatar -->
        <div class="campo-grupo">
          <label class="campo-label" id="label-avatar">Escolha seu avatar</label>
          <div class="avatar-grid" id="avatar-grid" role="radiogroup" aria-labelledby="label-avatar">
           
            <button class="avatar-btn ativo"   data-av="midia/lion.png"   aria-label="Leão" aria-pressed="true" role="radio"> <img src="midia/lion.png" alt="Leão"> </button>
            <button class="avatar-btn"   data-av="midia/frog.png"   aria-label="Sapo" aria-pressed="false" role="radio"> <img src="midia/frog.png" alt="Sapo"> </button>
            <button class="avatar-btn"   data-av="midia/butterfly.png"   aria-label="Borboleta" aria-pressed="false" role="radio"> <img src="midia/butterfly.png" alt="Borboleta"> </button>
            <button class="avatar-btn"   data-av="midia/sea-turtle.png"   aria-label="Tartaruga" aria-pressed="false" role="radio"> <img src="midia/sea-turtle.png" alt="Tartaruga"> </button>
            <button class="avatar-btn"   data-av="midia/fox.png"   aria-label="Raposa" aria-pressed="false" role="radio"> <img src="midia/fox.png" alt="Raposa"> </button>
            <button class="avatar-btn"   data-av="midia/penguin.png"   aria-label="Pinguim" aria-pressed="false" role="radio"> <img src="midia/penguin.png" alt="Pinguim"> </button>
            <button class="avatar-btn"   data-av="midia/dragon.png"   aria-label="Dragão" aria-pressed="false" role="radio"> <img src="midia/dragon.png" alt="Dragão"> </button>
            <button class="avatar-btn"   data-av="midia/panda.png"   aria-label="Panda" aria-pressed="false" role="radio"> <img src="midia/panda.png" alt="Panda"> </button>
          </div>
        </div>

        <!-- Data de nascimento -->
        <div class="campo-grupo">
          <label class="campo-label" for="input-nascimento">🎂 Data de nascimento</label>
          <input
            type="date"
            id="input-nascimento"
            class="campo-input"
            aria-label="Data de nascimento"
            aria-required="true"
            required
          />
          <span class="campo-erro oculto" id="erro-nascimento" role="alert">Informe a data de nascimento.</span>
          <p class="tela-sub" id="faixa-preview" style="margin-top:.35rem;font-size:.85rem;" aria-live="polite"></p>
        </div>

        <!-- Gênero favorito -->
        <div class="campo-grupo">
          <label class="campo-label" id="label-genero">Gênero de história favorito</label>
          <div class="chip-grupo" id="genero-grupo" role="radiogroup" aria-labelledby="label-genero">
            <button class="chip ativo" data-genero="narrativo"    aria-pressed="true">📖 Narrativo</button>
            <button class="chip"       data-genero="poetico"      aria-pressed="false">🎵 Poético</button>
            <button class="chip"       data-genero="instrucional" aria-pressed="false">📋 Instrucional</button>
            <button class="chip"       data-genero="descritivo"   aria-pressed="false">🔍 Descritivo</button>
            <button class="chip"       data-genero="informativo"  aria-pressed="false">💡 Informativo</button>
          </div>
        </div>
        <div class="campo-grupo">
          <label class="campo-label" for="input-horario"> ⏰ Qual horário você mais gosta de brincar no Fabular?</label>
          <input
            type="time"
            id="input-horario"
            class="campo-input"
            aria-label="Horário preferido para jogar"/>
        </div>

        <button class="btn-principal btn-entrar" id="btn-iniciar" aria-label="Iniciar aventura">
          🚀 Iniciar Aventura!
        </button>
        <button class="btn-secundario" id="btn-voltar-perfis" type="button">← Voltar para seleção de perfil</button>
      </div>

      <div class="login-card" id="responsavel-card" role="region" aria-label="Login do responsável">
        <h2 class="login-card-titulo" id="resp-titulo">👤 Entrar</h2>
        <div id="resp-auth-box">
          <div id="resp-campos-cadastro" class="oculto">
            <div class="campo-grupo">
              <label class="campo-label" for="resp-nome">Nome</label>
              <input type="text" id="resp-nome" class="campo-input" placeholder="Nome do responsável" />
            </div>
            <div class="campo-grupo">
              <label class="campo-label" for="resp-sobrenome">Sobrenome</label>
              <input type="text" id="resp-sobrenome" class="campo-input" placeholder="Sobrenome" />
            </div>
            <div class="campo-grupo">
              <label class="campo-label" for="resp-telefone">Telefone</label>
              <input type="tel" id="resp-telefone" class="campo-input" placeholder="(11) 99999-9999" maxlength="15" />
            </div>
          </div>
          <div class="campo-grupo">
            <label class="campo-label" for="resp-email">E-mail</label>
            <input type="email" id="resp-email" class="campo-input" placeholder="email@exemplo.com" />
          </div>
          <div class="campo-grupo">
            <label class="campo-label" for="resp-senha">Senha</label>
            <input type="password" id="resp-senha" class="campo-input" placeholder="••••••••" />
          </div>
          <div id="resp-campo-confirmar-senha" class="campo-grupo oculto">
            <label class="campo-label" for="resp-confirmar-senha">Confirmar senha</label>
            <input type="password" id="resp-confirmar-senha" class="campo-input" placeholder="••••••••" />
          </div>
          <button class="btn-principal" id="btn-resp-continuar">Continuar</button>
          <p class="resp-link-texto" id="resp-link-esqueci"><button class="link-inline" id="btn-esqueci-senha" type="button">Esqueci minha senha</button></p>
          <p class="resp-link-texto" id="resp-link-alterar"></p>
        </div>
        <div id="resp-recuperar-box" class="oculto">
          <div class="campo-grupo">
            <label class="campo-label" for="resp-email-reset">E-mail</label>
            <input type="email" id="resp-email-reset" class="campo-input" placeholder="email@exemplo.com" />
            <button class="btn-secundario" id="btn-enviar-codigo" type="button">Enviar código por e-mail</button>
          </div>
          <div class="campo-grupo">
            <label class="campo-label" for="resp-codigo-reset">Código recebido no e-mail</label>
            <input type="text" id="resp-codigo-reset" class="campo-input" placeholder="Ex: 123456" maxlength="6" />
          </div>
          <div class="campo-grupo">
            <label class="campo-label" for="resp-nova-senha">Nova senha</label>
            <input type="password" id="resp-nova-senha" class="campo-input" placeholder="Digite a nova senha" />
          </div>
          
          <button class="btn-principal" id="btn-resetar-senha" type="button">Redefinir senha</button>
          <button class="link-inline" id="btn-cancelar-reset" type="button">Voltar para login</button>
        </div>
        <span class="campo-erro oculto" id="resp-erro" role="alert"></span>
      </div>

      <div class="login-card oculto" id="perfis-card" role="region" aria-label="Seleção de perfil infantil">
        <div class="perfis-header-wrap">
          <h2 class="login-card-titulo" style="margin: 0;">👨‍👩‍👧 Troca de perfil</h2>
          <button class="btn-config-engrenagem" id="btn-ir-configuracoes" title="Configurações" aria-label="Configurações">
            <img src="midia/gear.png" alt="Configurações" class="img-engrenagem" />
          </button>
        </div>
        <p class="tela-sub">Escolha uma criança para entrar no sistema.</p>
        <div id="perfis-lista" class="avatar-grid"></div>
        <button class="btn-secundario" id="btn-add-crianca">+ Adicionar criança</button>
        <button class="btn-principal" id="btn-logout-resp">Sair da conta do responsável</button>
      </div>

    </div>
  </div>

  <script src="js/models/faixaEtaria.js"></script>
  <script src="js/utils/avatarUtils.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
